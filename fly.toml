# Fly.io app configuration for the full-stack showroom.

app = "fast-and-furious-car-showroom"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  PORT = "8000"
  APP_URL = "https://fast-and-furious-car-showroom.fly.dev"